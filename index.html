
<style>
#vx-chat-button {
  position: fixed;
  right: 20px;
  bottom: 92px;
  z-index: 9998;
  width: 60px;
  height: 60px;
  border: 1px solid #d8b4fe;
  border-radius: 50%;
  background: linear-gradient(135deg, #a855f7, #7928ca);
  color: white;
  font-size: 27px;
  cursor: pointer;
  box-shadow: 0 0 25px #a855f755;
}
#vx-chat-window {
  position: fixed;
  right: 20px;
  bottom: 164px;
  z-index: 9999;
  width: min(370px, calc(100vw - 28px));
  height: min(510px, calc(100dvh - 190px));
  min-height: 340px;
  display: none;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #a855f766;
  border-radius: 18px;
  background: #0d0a14;
  color: #f7f3ff;
  box-shadow: 0 15px 55px #000b;
  font-family: Inter, Arial, sans-serif;
}
#vx-chat-window.vx-open {
  display: flex;
}
.vx-chat-header {
  padding: 16px;
  background: linear-gradient(120deg, #7928ca, #301044);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.vx-chat-header strong {
  display: block;
  font-size: 15px;
}
.vx-chat-header small {
  display: block;
  opacity: .8;
  font-size: 11px;
}
#vx-chat-close {
  background: transparent;
  color: white;
  border: 0;
  font-size: 24px;
  cursor: pointer;
}
#vx-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.vx-chat-message {
  max-width: 88%;
  padding: 10px 12px;
  border-radius: 13px;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.vx-chat-bot {
  align-self: flex-start;
  background: #1b1428;
  border: 1px solid #a855f733;
}
.vx-chat-user {
  align-self: flex-end;
  background: #7928ca;
}
#vx-chat-form {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #a855f733;
}
#vx-chat-input {
  flex: 1;
  min-width: 0;
  background: #171123;
  color: white;
  border: 1px solid #a855f755;
  border-radius: 10px;
  padding: 11px;
  outline: none;
}
#vx-chat-input:focus {
  border-color: #c084fc;
}
#vx-chat-send {
  background: #a855f7;
  border: 0;
  border-radius: 10px;
  padding: 0 15px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
#vx-chat-send:disabled {
  opacity: .5;
  cursor: wait;
}
@media (max-width: 480px) {
  #vx-chat-button {
    right: 14px;
    bottom: 84px;
  }
  #vx-chat-window {
    right: 14px;
    bottom: 153px;
  }
}
</style>

<button id="vx-chat-button" type="button"
  aria-label="Abrir assistente virtual da VELTRONIX"
  aria-expanded="false">✦</button>

<section id="vx-chat-window" aria-label="Chat da VELTRONIX">
  <div class="vx-chat-header">
    <div>
      <strong>VELTRONIX AI</strong>
      <small>Assistente virtual • Tire suas dúvidas</small>
    </div>
    <button id="vx-chat-close" type="button"
      aria-label="Fechar chat">×</button>
  </div>

  <div id="vx-chat-messages" aria-live="polite">
    <div class="vx-chat-message vx-chat-bot">Olá! 👋 Sou o assistente virtual da VELTRONIX. Como posso ajudar você hoje?</div>
  </div>

  <form id="vx-chat-form">
    <input id="vx-chat-input" type="text" maxlength="4000"
      placeholder="Digite sua mensagem..." autocomplete="off"
      aria-label="Sua mensagem" required>
    <button id="vx-chat-send" type="submit">Enviar</button>
  </form>
</section>

<script>
(function () {
  "use strict";

  const endpoint =
    "https://swgrurgztdcyhtrjpotc.supabase.co/functions/v1/smooth-responder";

  const button = document.getElementById("vx-chat-button");
  const windowChat = document.getElementById("vx-chat-window");
  const closeButton = document.getElementById("vx-chat-close");
  const messages = document.getElementById("vx-chat-messages");
  const formChat = document.getElementById("vx-chat-form");
  const input = document.getElementById("vx-chat-input");
  const sendButton = document.getElementById("vx-chat-send");

  const history = [];

  function addMessage(text, type) {
    const item = document.createElement("div");
    item.className = "vx-chat-message " +
      (type === "user" ? "vx-chat-user" : "vx-chat-bot");
    item.textContent = text;
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
    return item;
  }

  function toggleChat(open) {
    windowChat.classList.toggle("vx-open", open);
    button.setAttribute("aria-expanded", String(open));

    if (open) {
      input.focus();
    }
  }

  button.addEventListener("click", function () {
    toggleChat(!windowChat.classList.contains("vx-open"));
  });

  closeButton.addEventListener("click", function () {
    toggleChat(false);
  });

  formChat.addEventListener("submit", async function (event) {
    event.preventDefault();

    const message = input.value.trim();
    if (!message || sendButton.disabled) return;

    addMessage(message, "user");
    input.value = "";
    input.disabled = true;
    sendButton.disabled = true;
    sendButton.textContent = "...";

    const waiting = addMessage("Estou pensando...", "bot");

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message,
          history: history.slice(-12)
        })
      });

      const data = await response.json();

      if (!response.ok || !data.reply) {
        throw new Error(data.error || "Não foi possível obter uma resposta.");
      }

      waiting.textContent = data.reply;

      history.push(
        { role: "user", text: message },
        { role: "model", text: data.reply }
      );

      if (history.length > 12) {
        history.splice(0, history.length - 12);
      }
    } catch (error) {
      console.error("Erro no chat VELTRONIX:", error);
      waiting.textContent =
        "Não consegui responder agora. Tente novamente em instantes.";
    } finally {
      input.disabled = false;
      sendButton.disabled = false;
      sendButton.textContent = "Enviar";
      messages.scrollTop = messages.scrollHeight;
      input.focus();
    }
  });
})();
</script>
</body>
