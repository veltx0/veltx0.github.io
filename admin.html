<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08060d">
<title>Painel Administrativo | VELTRONIX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#08060d;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
header{
  padding:22px 5%;
  border-bottom:1px solid #282033;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{font-size:25px;font-weight:900}
.brand span{color:#b65cff}
.container{
  width:min(1100px,92%);
  margin:40px auto;
}
h1{font-size:30px;margin-bottom:12px}
.muted{color:#9993a5}
.card{
  background:#110d19;
  border:1px solid #30213e;
  border-radius:15px;
  padding:25px;
  margin:22px 0;
}
input{
  width:100%;
  padding:14px;
  margin:10px 0 18px;
  border:1px solid #42304f;
  border-radius:9px;
  background:#09070e;
  color:#fff;
  outline:none;
}
input:focus{border-color:#b65cff}
button{
  border:0;
  padding:13px 20px;
  border-radius:9px;
  color:white;
  font-weight:bold;
  background:linear-gradient(100deg,#7624bd,#b65cff);
}
button:disabled{opacity:.5}
.logout{background:#35253f}
.login{
  width:min(430px,92%);
  margin:90px auto;
}
label{display:block;color:#d6c8e2}
#loginStatus,#status{
  margin-top:15px;
  color:#c084fc;
  line-height:1.5;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.stat strong{
  display:block;
  color:#bd73ff;
  font-size:38px;
  margin-top:15px;
}
.quote{
  border:1px solid #352443;
  background:#0c0911;
  border-radius:12px;
  padding:20px;
  margin:15px 0;
}
.quote h3{color:#c084fc;margin-bottom:12px}
.quote p{color:#d5d0dc;line-height:1.7;overflow-wrap:anywhere}
.quote button{margin-top:15px}
.empty{padding:25px;text-align:center;color:#aaa}
.hidden{display:none!important}
@media(max-width:650px){
  .stats{grid-template-columns:1fr}
  header{padding:18px 4%}
  h1{font-size:25px}
  .container{margin:25px auto}
  .card{padding:18px}
}
</style>
</head>

<body>

<header>
  <div class="brand">VELTRONI<span>X</span></div>
  <span class="muted">ADMINISTRAÇÃO</span>
</header>

<section id="loginArea" class="login">
  <div class="card">
    <h1>Acessar painel</h1>
    <p class="muted">Entre com sua conta administrativa.</p>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="Seu e-mail" required>

      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Sua senha" required>

      <button id="loginButton" type="submit" style="width:100%">
        Entrar no painel
      </button>
    </form>

    <p id="loginStatus"></p>
  </div>
</section>

<main id="dashboard" class="container hidden">
  <h1>Painel VELTRONIX</h1>
  <p class="muted">Conectado como <span id="userEmail"></span></p>

  <div style="margin-top:22px">
    <button class="logout" id="logoutButton">Sair da conta</button>
    <button id="refreshButton" style="margin-left:8px">Atualizar</button>
  </div>

  <section class="stats">
    <div class="card stat">
      <p class="muted">Total de orçamentos</p>
      <strong id="totalQuotes">0</strong>
    </div>
    <div class="card stat">
      <p class="muted">Clientes cadastrados</p>
      <strong id="totalClients">0</strong>
    </div>
    <div class="card stat">
      <p class="muted">Serviços solicitados</p>
      <strong id="totalServices">0</strong>
    </div>
  </section>

  <section class="card">
    <h2>Orçamentos recebidos</h2>
    <p id="status" class="muted">Carregando informações...</p>
    <div id="quotesList"></div>
  </section>
</main>

<script>
const SUPABASE_URL =
  "https://swgrurgztdcyhtrjpotc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Lia6ra-n7B3VZwZt5GgQBA_mbhm7gg6";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const loginArea = document.getElementById("loginArea");
const dashboard = document.getElementById("dashboard");
const loginStatus = document.getElementById("loginStatus");
const statusText = document.getElementById("status");

function showLogin(){
  loginArea.classList.remove("hidden");
  dashboard.classList.add("hidden");
}

function showDashboard(user){
  loginArea.classList.add("hidden");
  dashboard.classList.remove("hidden");
  document.getElementById("userEmail").textContent =
    user.email || "";
  loadQuotes();
}

async function checkSession(){
  const {data,error} = await supabaseClient.auth.getSession();

  if(error){
    loginStatus.textContent = error.message;
    return;
  }

  if(data.session){
    showDashboard(data.session.user);
  }else{
    showLogin();
  }
}

document.getElementById("loginForm")
.addEventListener("submit",async function(event){
  event.preventDefault();

  const button = document.getElementById("loginButton");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Entrando...";
  loginStatus.textContent = "";

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  button.disabled = false;
  button.textContent = "Entrar no painel";

  if(error){
    loginStatus.textContent =
      "Não foi possível entrar: " + error.message;
    return;
  }

  showDashboard(data.user);
});

async function loadQuotes(){
  statusText.textContent = "Buscando orçamentos...";
  const list = document.getElementById("quotesList");
  list.innerHTML = "";

  const {data,error} = await supabaseClient
    .from("orcamentos")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    statusText.textContent =
      "Erro ao carregar: " + error.message;
    return;
  }

  const quotes = data || [];
  const clients = new Set(
    quotes.map(q => q.contato).filter(Boolean)
  );
  const services = new Set(
    quotes.map(q => q.servico).filter(Boolean)
  );

  document.getElementById("totalQuotes").textContent =
    quotes.length;

  document.getElementById("totalClients").textContent =
    clients.size;

  document.getElementById("totalServices").textContent =
    services.size;

  if(quotes.length === 0){
    statusText.textContent = "Nenhum orçamento recebido ainda.";
    list.innerHTML =
      '<div class="empty">Os novos pedidos aparecerão aqui.</div>';
    return;
  }

  statusText.textContent =
    quotes.length + " orçamento(s) encontrado(s).";

  quotes.forEach(quote => {
    const article = document.createElement("article");
    article.className = "quote";

    const title = document.createElement("h3");
    title.textContent = quote.nome || "Cliente sem nome";

    const details = document.createElement("p");

    const fields = [
      ["WhatsApp",quote.contato],
      ["Serviço",quote.servico],
      ["Descrição",quote.descricao],
      ["Prazo",quote.prazo],
      ["Orçamento previsto",quote.valor]
    ];

    fields.forEach(([label,value]) => {
      const line = document.createElement("div");
      const strong = document.createElement("strong");
      strong.textContent = label + ": ";
      line.appendChild(strong);
      line.appendChild(
        document.createTextNode(value || "Não informado")
      );
      details.appendChild(line);
    });

    article.appendChild(title);
    article.appendChild(details);

    if(quote.contato){
      const whatsapp = document.createElement("button");
      whatsapp.textContent = "Conversar pelo WhatsApp";
      whatsapp.addEventListener("click",() => {
        const number = quote.contato.replace(/\D/g,"");
        window.open(
          "https://wa.me/" + number,
          "_blank",
          "noopener,noreferrer"
        );
      });
      article.appendChild(whatsapp);
    }

    list.appendChild(article);
  });
}

document.getElementById("refreshButton")
.addEventListener("click",loadQuotes);

document.getElementById("logoutButton")
.addEventListener("click",async function(){
  const {error} = await supabaseClient.auth.signOut();

  if(error){
    statusText.textContent = error.message;
    return;
  }

  showLogin();
});

supabaseClient.auth.onAuthStateChange(
  (_event,session) => {
    if(session){
      showDashboard(session.user);
    }else{
      showLogin();
    }
  }
);

checkSession();
</script>

</body>
</html>
